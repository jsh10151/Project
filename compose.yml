services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spacepick
      MYSQL_USER: spacepick
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--default-time-zone=+00:00"]
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["spacepick_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30
volumes:
  spacepick_data:
