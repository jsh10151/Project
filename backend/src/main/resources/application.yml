server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SPACEPICK_SESSION
        http-only: true
        same-site: strict
        secure: ${SECURE_COOKIES:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/spacepick?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:spacepick}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
app:
  admin-email: ${ADMIN_EMAIL:admin@spacepick.local}
  admin-password: ${ADMIN_PASSWORD}

payments:
  toss:
    enabled: ${TOSS_TEST_ENABLED:false}
    test-secret-key: ${TOSS_TEST_SECRET_KEY:}
    test-client-key: ${TOSS_TEST_CLIENT_KEY:}
