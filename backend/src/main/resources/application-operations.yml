management:
  server:
    port: 9091
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  pattern:
    level: '%5p [request:%X{requestId:-none}]'